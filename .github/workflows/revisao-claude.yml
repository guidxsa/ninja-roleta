# Revisão cruzada (AGENTS.md, "Dois agentes"; docs/processo/revisao.md): o Claude revisa os PRs implementados pelo Codex.
# Os PRs do Claude são revisados pela revisão automática do Codex, ligada nas configurações do Codex.
# Autentica com o token da assinatura do usuário (segredo CLAUDE_CODE_OAUTH_TOKEN, gerado uma vez com `claude setup-token`).
# Sem o segredo, a revisão é pulada com um aviso e o PR segue: a revisão informa, não é check obrigatório.
name: Revisão do Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: revisao-claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Automática: PR aberto ou atualizado que o Codex implementou (modelo de PR com "Implementou: codex", ou branch codex/*).
  # PR do Claude não aciona o Claude: quem implementa não revisa.
  automatica:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (contains(github.event.pull_request.body, 'Implementou: codex') || startsWith(github.head_ref, 'codex/'))
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: revisão do Claude pulada (como configurar: docs/processo/revisao.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0 # a revisão compara com o origin/master
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Você é o revisor deste PR (repositório ${{ github.repository }}, PR #${{ github.event.pull_request.number }}).
            Ele foi implementado pelo Codex; pela regra do projeto, quem implementa não revisa.
            Siga as instruções de docs/processo/revisao.md. É só revisão: não altere arquivos, não faça commit.
            Comente os achados específicos na linha (comentário inline) e publique o resumo com o veredito num
            comentário do PR (gh pr comment).
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm run check),Bash(npm run check:regras*),Bash(npm run check:escopo),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  # À mão: comentário com "@claude" num PR, de quem tem acesso ao repositório (ex.: "@claude revise seguindo
  # docs/processo/revisao.md"). Vale para qualquer PR, inclusive para repetir a revisão depois de correções.
  comentario:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: revisão do Claude pulada (como configurar: docs/processo/revisao.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm run check),Bash(npm run check:regras*),Bash(npm run check:escopo),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --append-system-prompt "Ao revisar um PR deste repositório, siga docs/processo/revisao.md. Só revisão: não altere arquivos nem faça commit."
