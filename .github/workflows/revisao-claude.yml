# Revisão cruzada (AGENTS.md, "Dois agentes"; docs/processo/revisao.md): o Claude revisa os PRs implementados pelo Codex.
# Os PRs do Claude são revisados pela revisão automática do Codex, ligada nas configurações do Codex.
# Autentica com o token da assinatura do usuário (segredo CLAUDE_CODE_OAUTH_TOKEN, gerado uma vez com `claude setup-token`).
# Sem o segredo, a revisão é pulada com um aviso e o PR segue: a revisão informa, não é check obrigatório.
# Loop (docs/processo/revisao.md, "Loop"): revisão com achados → o autor corrige → nova revisão, até não haver achado
# ou acabar o limite de rodadas. PR do Codex: o job automatica pede a correção com "@codex address that feedback".
# PR do Claude: a revisão do Codex com achados aciona o job corrige, que corrige na branch e pede "@codex review".
name: Revisão do Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  statuses: write # portão revisao-cruzada do staging (docs/processo/fluxo.md)

env:
  # Rodadas de correção por PR (os dois sentidos juntos), contadas pelo marcador <!-- loop-revisao:rodada --> nos
  # comentários. No limite, o loop para e avisa o usuário no PR.
  LIMITE_RODADAS: 3
  # Piloto de perfis de modelo nos PRs de feature/issue-<n> (docs/processo/metricas.md; issues-claude.yml).
  PILOTO_PERFIS: ${{ vars.PILOTO_PERFIS }}

# A concorrência fica em cada job, e não no workflow: só um job que passou do filtro entra no grupo,
# então um comentário comum no PR não cancela a revisão em andamento.

jobs:
  # Automática: PR aberto ou atualizado que o Codex implementou (modelo de PR com "Implementou: codex", ou branch codex/*).
  # PR do Claude não aciona o Claude: quem implementa não revisa.
  automatica:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (contains(github.event.pull_request.body, 'Implementou: codex') || startsWith(github.head_ref, 'codex/'))
    # Push novo no PR substitui a revisão do commit anterior.
    concurrency:
      group: revisao-claude-auto-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: revisão do Claude pulada (como configurar: docs/processo/revisao.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          # O passo do loop só lê o veredito publicado por esta execução.
          echo "inicio=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0 # a revisão compara com o origin/master
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Você é o revisor deste PR (repositório ${{ github.repository }}, PR #${{ github.event.pull_request.number }}).
            Ele foi implementado pelo Codex; pela regra do projeto, quem implementa não revisa.
            Siga as instruções de docs/processo/revisao.md. É só revisão: não altere arquivos, não faça commit.
            Comente os achados específicos na linha (comentário inline) e publique o resumo com o veredito num
            comentário do PR (gh pr comment).
            Termine esse comentário de resumo com uma linha só com o marcador do veredito, que o workflow lê para o loop
            de correção: <!-- revisao-claude:veredito=aprovado -->, <!-- revisao-claude:veredito=ressalvas --> ou
            <!-- revisao-claude:veredito=mudancas --> (este último só com achado que bloqueia o merge). Se for "mudancas",
            o workflow pede ao Codex que corrija os achados que bloqueiam o merge: escreva-os de forma que o Codex
            consiga agir (arquivo:linha, problema e correção sugerida). Não mencione o Codex com arroba: quem chama é o workflow.
            Cada "melhoria futura" e cada inconsistência fora do escopo do PR vira uma issue descritiva, como manda
            docs/processo/issues.md (procure duplicata com gh issue list antes; cite o número da issue no resumo).
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm run check),Bash(npm run check:regras*),Bash(npm run check:escopo),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue create:*)"
      # Loop, PR do Codex: veredito "precisa de mudanças" → pede a correção ao Codex. O push do Codex dispara esta
      # revisão de novo (synchronize). Só PR da própria base e até o limite de rodadas.
      - name: Pedir a correção ao Codex
        if: >-
          steps.token.outputs.ok == 'true' && !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          INICIO: ${{ steps.token.outputs.inicio }}
        run: |
          comentarios() { gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | .created_at + " " + (.body | gsub("\n"; " "))'; }
          veredito=$(comentarios | awk -v t="$INICIO" '$1 >= t' | grep -o 'revisao-claude:veredito=[a-z]*' | tail -n 1 | cut -d= -f2 || true)
          echo "Veredito desta revisão: ${veredito:-nenhum}"
          # Aprovado ou com ressalvas: status revisao-cruzada verde no commit revisado, se ainda for a ponta do PR
          # (portão do auto-merge no staging, docs/processo/fluxo.md).
          if [ "$veredito" = "aprovado" ] || [ "$veredito" = "ressalvas" ]; then
            if [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$SHA" ]; then
              gh api "repos/$GH_REPO/statuses/$SHA" -f state=success -f context=revisao-cruzada -f description="Revisão do Claude: $veredito" > /dev/null
            fi
            exit 0
          fi
          if [ "$veredito" != "mudancas" ]; then exit 0; fi
          rodadas=$(comentarios | grep -c '<!-- loop-revisao:rodada -->' || true)
          if [ "$rodadas" -ge "$LIMITE_RODADAS" ]; then
            # Sem arroba no aviso: mencionar o Codex aqui pediria mais uma rodada.
            if [ "$(comentarios | grep -c '<!-- loop-revisao:limite -->' || true)" -eq 0 ]; then
              printf '%s\n' "Loop da revisão parado: $rodadas de $LIMITE_RODADAS rodadas de correção usadas e a revisão do Claude ainda pede mudanças. Decisão do usuário: corrigir à mão, pedir mais uma rodada ao Codex num comentário ou aceitar como está (docs/processo/revisao.md, \"Loop\")." "" '<!-- loop-revisao:limite -->' > "$RUNNER_TEMP/limite.md"
              gh pr comment "$PR" --body-file "$RUNNER_TEMP/limite.md"
            fi
            exit 0
          fi
          printf '%s\n' "@codex address that feedback" "" "Corrija nesta branch os achados que bloqueiam o merge da revisão do Claude acima, seguindo AGENTS.md e o contrato da tarefa, e dê push. Rodada $((rodadas + 1)) de $LIMITE_RODADAS do loop de revisão (docs/processo/revisao.md, \"Loop\")." "" '<!-- loop-revisao:rodada -->' > "$RUNNER_TEMP/pedido.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/pedido.md"

  # À mão: comentário com "@claude" num PR, de quem tem acesso ao repositório (ex.: "@claude revise seguindo
  # docs/processo/revisao.md"). Vale para qualquer PR, inclusive para repetir a revisão depois de correções.
  # O issue_comment roda no contexto do repositório, com os segredos, mesmo num PR de fork: por isso este job
  # nunca executa código do PR (sem npm ci nem npm run, checkout sem credencial gravada). O Claude lê o diff
  # e confere o resultado da CI com gh pr checks.
  comentario:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # Pedidos seguidos entram na fila, sem cancelar o que está rodando.
    concurrency:
      group: revisao-claude-comentario-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: revisão do Claude pulada (como configurar: docs/processo/revisao.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue create:*)"
            --append-system-prompt "Ao revisar um PR deste repositório, siga docs/processo/revisao.md; melhoria futura e inconsistência fora do escopo viram issue (docs/processo/issues.md). Só revisão: não altere arquivos nem faça commit. Não execute código do PR (npm, scripts): a verificação é o resultado da CI, em gh pr checks."

  # Loop, PR do Claude: a revisão do Codex com achados aciona o Claude, que corrige na branch do PR; depois o workflow
  # confere o push e pede nova revisão com "@codex review". Sem achados, o Codex só comenta "Didn't find any major
  # issues" (não há evento de revisão) e o loop para.
  # Este job executa código do PR (npm ci, npm run check) com os segredos: por isso só roda em pull_request_review de
  # PR da própria base (um PR de fork nunca entra aqui) e nunca em issue_comment.
  corrige:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      !contains(github.event.review.body, 'Didn''t find any major issues') &&
      github.event.pull_request.state == 'open' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      contains(github.event.pull_request.body, 'Implementou: claude')
    # Revisões seguidas do mesmo PR entram na fila; cada uma confere se ainda vale para a ponta do PR.
    concurrency:
      group: loop-revisao-corrige-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA_REVISADO: ${{ github.event.review.commit_id }}
      REVISAO: ${{ github.event.review.id }}
    steps:
      - name: Conferir o token, a revisão e o limite de rodadas
        id: rodada
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: correção do Claude pulada (como configurar: docs/processo/revisao.md)."
            exit 0
          fi
          ponta=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$ponta" != "$SHA_REVISADO" ]; then
            echo "::notice::O PR andou depois desta revisão ($SHA_REVISADO → $ponta): correção pulada."
            exit 0
          fi
          comentarios() { gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | .body | gsub("\n"; " ")'; }
          rodadas=$(comentarios | grep -c '<!-- loop-revisao:rodada -->' || true)
          if [ "$rodadas" -ge "$LIMITE_RODADAS" ]; then
            # Sem arroba no aviso: mencionar o Codex aqui pediria mais uma revisão.
            if [ "$(comentarios | grep -c '<!-- loop-revisao:limite -->' || true)" -eq 0 ]; then
              printf '%s\n' "Loop da revisão parado: $rodadas de $LIMITE_RODADAS rodadas de correção usadas e a revisão do Codex ainda tem achados. Decisão do usuário: corrigir à mão, pedir mais uma revisão ao Codex num comentário ou aceitar como está (docs/processo/revisao.md, \"Loop\")." "" '<!-- loop-revisao:limite -->' > "$RUNNER_TEMP/limite.md"
              gh pr comment "$PR" --body-file "$RUNNER_TEMP/limite.md"
            fi
            exit 0
          fi
          echo "numero=$((rodadas + 1))" >> "$GITHUB_OUTPUT"
          # A revisão vai para um arquivo fora do repositório: assim o Claude não precisa de gh api, que escreveria no PR.
          {
            echo "# Revisão $REVISAO do Codex (commit $SHA_REVISADO)"
            gh api "repos/$GH_REPO/pulls/$PR/reviews/$REVISAO" --jq .body
            echo
            echo "## Comentários na linha"
            gh api "repos/$GH_REPO/pulls/$PR/reviews/$REVISAO/comments" --paginate --jq '.[] | "\n### \(.path):\(.line // .original_line // "?")\n\(.body)"'
          } > "$RUNNER_TEMP/revisao-codex.md"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.rodada.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }} # a branch, para o commit ir para ela
          fetch-depth: 0 # o check:regras compara com o origin/master
          persist-credentials: false # o push usa só a credencial que o claude-code-action configura
      - uses: actions/setup-node@v4
        if: steps.rodada.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.rodada.outputs.ok == 'true'
      # PR de feature/issue-<n>: perfil de modelo da issue, com escalada a partir da 2ª rodada (docs/processo/metricas.md).
      # Branch criada antes do piloto (sem o script): segue no modelo padrão, sem registro.
      - name: Escolher o perfil (PR de issue)
        id: perfil
        if: steps.rodada.outputs.ok == 'true' && startsWith(github.event.pull_request.head.ref, 'feature/issue-')
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ETAPA: revisao-${{ steps.rodada.outputs.numero }}
        run: |
          ISSUE="${HEAD_REF#feature/issue-}"
          case "$ISSUE" in ''|*[!0-9]*) echo "::notice::Branch $HEAD_REF sem número de issue: sem perfil."; exit 0 ;; esac
          [ -f scripts/metricas-execucao.ts ] || { echo "::notice::Branch sem scripts/metricas-execucao.ts: sem perfil."; exit 0; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          ISSUE="$ISSUE" npx tsx scripts/metricas-execucao.ts perfil || echo "::warning::Perfil não escolhido: modelo padrão."
      # Push: só "git push origin HEAD" está liberado (a branch do PR, em checkout; sem --force, sem outra branch).
      # Commit sem atribuição: as configurações abaixo desligam o Co-Authored-By e o passo seguinte confere.
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.rodada.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Você é o autor deste PR (repositório ${{ github.repository }}, PR #${{ github.event.pull_request.number }}, branch em checkout).
            O Codex revisou o commit ${{ github.event.review.commit_id }} e deixou achados, salvos em ${{ runner.temp }}/revisao-codex.md.
            Esta é a rodada ${{ steps.rodada.outputs.numero }} de ${{ env.LIMITE_RODADAS }} do loop de revisão (docs/processo/revisao.md, "Loop").
            Siga o AGENTS.md e o contrato da tarefa (docs/tarefas/<tema>.md, com o tema da branch feature/<tema>).
            1. Para cada achado, decida se procede. O que não procede, não mexa: explique no resumo.
            2. Corrija só o que procede e cabe no escopo do contrato. Achado que pede sair do escopo, mudar balanceamento
               ou decisão do usuário: não corrija; abra uma issue descritiva (docs/processo/issues.md, procurando
               duplicata com gh issue list antes) e cite o número no resumo.
            3. Rode npm run check até passar. Doc da regra no mesmo commit, como manda o AGENTS.md.
            4. Faça commit em português, sem Co-Authored-By nem outra linha de atribuição, e dê push com exatamente
               "git push origin HEAD" (nunca --force, nunca outra branch).
            5. Publique um resumo no PR (gh pr comment) com o que corrigiu, o que não corrigiu e por quê, e a saída do
               npm run check. Não mencione o Codex com arroba: quem pede a nova revisão é o workflow.
            Se nenhum achado proceder, não faça commit; só publique o resumo.
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run check),Bash(npm run check:*),Bash(npm test),Bash(npm test:*),Bash(npm run typecheck),Bash(npm run proto),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue create:*)"
            --settings '{"includeCoAuthoredBy":false,"attribution":{"commit":"","pr":""}}'
            ${{ steps.perfil.outputs.modelo && format('--model {0}', steps.perfil.outputs.modelo) || '' }}
      - name: Conferir o push e pedir nova revisão ao Codex
        id: conferir
        if: steps.rodada.outputs.ok == 'true' && !cancelled()
        env:
          NUMERO: ${{ steps.rodada.outputs.numero }}
        run: |
          avisa() {
            printf '%s\n' "$1" "" "Loop da revisão parado nesta rodada; decisão do usuário (docs/processo/revisao.md, \"Loop\")." > "$RUNNER_TEMP/aviso.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/aviso.md"
          }
          nova=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$nova" = "$SHA_REVISADO" ]; then
            echo "resultado=sem-commit" >> "$GITHUB_OUTPUT"
            avisa "O Claude não fez commit para a revisão do Codex (achados que não procedem, fora do escopo ou correção que falhou): veja o resumo do Claude acima e o log do job."
            exit 0
          fi
          echo "resultado=corrigido" >> "$GITHUB_OUTPUT"
          # Sem push forçado: o commit novo descende do revisado.
          status=$(gh api "repos/$GH_REPO/compare/$SHA_REVISADO...$nova" --jq .status)
          if [ "$status" != "ahead" ]; then
            avisa "A branch do PR não descende mais do commit revisado ($SHA_REVISADO → $nova, comparação: $status). Confira se houve push forçado."
            exit 1
          fi
          mensagens=$(gh api "repos/$GH_REPO/compare/$SHA_REVISADO...$nova" --jq '.commits[].commit.message')
          if printf '%s\n' "$mensagens" | grep -qi 'co-authored-by'; then
            avisa "Um commit novo da correção tem linha Co-Authored-By, proibida no projeto (AGENTS.md, \"Convenções\"). Corrija o histórico à mão."
            exit 1
          fi
          printf '%s\n' "@codex review" "" "Correções da revisão anterior em $nova. Rodada $NUMERO de $LIMITE_RODADAS do loop de revisão (docs/processo/revisao.md, \"Loop\")." "" '<!-- loop-revisao:rodada -->' > "$RUNNER_TEMP/pedido.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/pedido.md"
      # Registro da rodada na issue do PR (docs/processo/metricas.md). Não trava o job.
      - name: Registrar as métricas (PR de issue)
        if: steps.rodada.outputs.ok == 'true' && !cancelled() && steps.perfil.outputs.issue != ''
        env:
          ISSUE: ${{ steps.perfil.outputs.issue }}
          ETAPA: revisao-${{ steps.rodada.outputs.numero }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          TENTATIVA: '1'
          PERFIL: ${{ steps.perfil.outputs.perfil }}
          MODELO: ${{ steps.perfil.outputs.modelo }}
          RESULTADO: ${{ steps.conferir.outputs.resultado || 'nao-rodou' }}
          FALHA: ${{ steps.claude.outcome != 'success' && 'execucao' || '' }}
        run: npx tsx scripts/metricas-execucao.ts registra || echo "::warning::Registro de métricas falhou (veja acima)."
