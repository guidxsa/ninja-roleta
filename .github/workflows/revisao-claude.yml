# Revisão do Claude à mão (docs/processo/revisao.md): um comentário com "@claude" num PR pede a revisão. Não há revisão
# automática nem portão: o staging é o playground dos agentes e a revisão humana é a release (docs/processo/fluxo.md).
# Autentica com o token da assinatura do usuário (segredo CLAUDE_CODE_OAUTH_TOKEN, gerado uma vez com `claude setup-token`);
# sem o segredo, a revisão é pulada com um aviso no log.
# A action do Claude só roda se este arquivo for igual ao do master (branch padrão): uma mudança nele vale depois da release.
name: Revisão do Claude

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # À mão: comentário com "@claude" num PR, de quem tem acesso ao repositório (ex.: "@claude revise seguindo
  # docs/processo/revisao.md"). Vale para qualquer PR, inclusive para repetir a revisão depois de correções.
  # O issue_comment roda no contexto do repositório, com os segredos, mesmo num PR de fork: por isso este job
  # nunca executa código do PR (sem npm ci nem npm run, checkout sem credencial gravada). O Claude lê o diff
  # e confere o resultado da CI com gh pr checks.
  comentario:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # Pedidos seguidos entram na fila, sem cancelar o que está rodando.
    concurrency:
      group: revisao-claude-comentario-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo CLAUDE_CODE_OAUTH_TOKEN: revisão do Claude pulada (como configurar: docs/processo/revisao.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue create:*)"
            --append-system-prompt "Ao revisar um PR deste repositório, siga docs/processo/revisao.md; melhoria futura e inconsistência fora do escopo viram issue (docs/processo/issues.md), sempre com as etiquetas inconsistencia e precisa-decisao, nunca correcao-automatica. Só revisão: não altere arquivos nem faça commit. Não execute código do PR (npm, scripts): a verificação é o resultado da CI, em gh pr checks."
