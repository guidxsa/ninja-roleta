# Staging (docs/processo/fluxo.md): playground dos agentes. O PR entra sozinho quando a CI aprova (check e meta), sem
# revisão cruzada; a revisão humana é a release, no PR permanente staging → master, com o merge e a tag do usuário.
#
# - automerge: liga o auto-merge nativo do GitHub; ele faz o merge quando check e meta ficam verdes (proteção do
#   staging). PR de processo (feature/harness*) não entra sozinho: o merge é do usuário (AGENTS.md, "Dois agentes").
# - fecha-issue: o "Closes #n" só fecha a issue no merge no master; no staging, o workflow fecha com um aviso.
# - integrado: a cada push no staging, reescreve o PR permanente staging → master (com a seção dos arquivos de processo
#   alterados no lote) e sugere a release.
# - sincroniza: a cada push no master (release ou hotfix), abre o PR master → staging se o staging não tem o master.
#
# Token: o segredo STAGING_TOKEN (token fino do dono, só deste repositório, com Contents e Pull requests de escrita).
# Merge e PR feitos com o GITHUB_TOKEN não disparam outros workflows (CI, preview, este job integrado); com o token do
# dono, disparam. Sem o segredo, o workflow avisa e não liga o auto-merge (o merge no staging fica à mão).
name: Staging

on:
  # pull_request_target: roda a versão deste arquivo do staging, não a do PR, então um PR não desliga a própria trava
  # (o PR de processo sem auto-merge). Nenhum job aqui faz checkout nem executa código do PR.
  pull_request_target:
    branches: [staging]
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  actions: write # pede o pages.yml (preview) a cada push no staging
  contents: read
  pull-requests: write
  issues: write

env:
  GH_REPO: ${{ github.repository }}
  # Sugestão de release no PR permanente: um item de peso alto ou este número de itens acumulados.
  SUGERIR_COM_ITENS: 8

jobs:
  automerge:
    if: >-
      github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.head_ref }}
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - name: Ligar o auto-merge
        run: |
          # PR de processo muda as próprias verificações: o merge é do usuário, que confere antes (AGENTS.md).
          case "$HEAD" in
            feature/harness|feature/harness-*)
              echo "::notice::PR de processo ($HEAD): sem auto-merge; o merge é do usuário."
              exit 0 ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo STAGING_TOKEN: auto-merge não ligado no PR #$PR; o merge no staging fica à mão (docs/processo/fluxo.md)."
            exit 0
          fi
          # Merge commit (preserva os commits da branch); nunca --admin: espera check e meta.
          GH_TOKEN="$TOKEN" gh pr merge "$PR" --auto --merge

  fecha-issue:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      CORPO: ${{ github.event.pull_request.body }}
    steps:
      - name: Fechar as issues do PR
        run: |
          for n in $(printf '%s' "$CORPO" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
            [ "$(gh issue view "$n" --json state --jq .state 2>/dev/null)" = "OPEN" ] || continue
            gh issue close "$n" --comment "Corrigida no staging pelo PR #$PR. Chega à produção na próxima release (docs/processo/fluxo.md)."
          done

  integrado:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: staging-integrado
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar o preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
      - name: Reescrever o PR permanente
        env:
          GH_TOKEN: ${{ secrets.STAGING_TOKEN || github.token }}
          PREVIEW: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/
        run: |
          git fetch -q origin master
          if [ -z "$(git log --oneline origin/master..HEAD)" ]; then echo "::notice::Staging igual ao master: nada pendente."; exit 0; fi
          npx tsx scripts/staging.ts pr > "$RUNNER_TEMP/pr.json"
          titulo=$(jq -r .titulo "$RUNNER_TEMP/pr.json"); jq -r .corpo "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/corpo.md"
          pr=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base master --head staging --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
            pr=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number // empty')
          else
            gh pr edit "$pr" --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
          fi
          # Sugestão de release, uma vez por ciclo (o marcador some quando o PR permanente é mergeado e outro abre).
          if [ "$(jq -r .sugerir "$RUNNER_TEMP/pr.json")" = "true" ] && [ -n "$pr" ] &&
             [ "$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate --jq '.[].body' | grep -c '<!-- staging:sugestao -->' || true)" -eq 0 ]; then
            jq -r .sugestao "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/sugestao.md"
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/sugestao.md"
          fi

  sincroniza:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR master → staging
        env:
          GH_TOKEN: ${{ secrets.STAGING_TOKEN || github.token }}
        run: |
          git fetch -q origin staging || { echo "::notice::Sem branch staging ainda."; exit 0; }
          if git merge-base --is-ancestor origin/master origin/staging; then echo "::notice::O staging já tem o master."; exit 0; fi
          [ -n "$TOKEN" ] || echo "::warning::Sem STAGING_TOKEN: o PR de sincronização não dispara a CI; faça o merge à mão."
          if [ -z "$(gh pr list --base staging --head master --state open --json number --jq '.[0].number // empty')" ]; then
            printf '%s\n' "Traz para o staging o que entrou no master (release ou hotfix), para a próxima versão partir dele (docs/processo/fluxo.md)." "" "Conflito: resolva numa branch feature/sincroniza-<data> a partir do staging, com merge do master, e abra o PR para o staging." > "$RUNNER_TEMP/sync.md"
            gh pr create --base staging --head master --title "Sincroniza o staging com o master" --body-file "$RUNNER_TEMP/sync.md"
          fi
