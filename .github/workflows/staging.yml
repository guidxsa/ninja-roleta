# Staging (docs/processo/fluxo.md): o PR dos agentes entra sozinho no staging quando a CI e a revisão cruzada aprovam;
# o staging chega ao master só pelo PR permanente, com o merge e a tag do usuário.
#
# - portao: status revisao-cruzada no commit da ponta do PR. O Codex sem achados (comentário "Didn't find any major
#   issues") aprova o PR do Claude; o veredito do Claude aprova o do Codex (revisao-claude.yml, job automatica); a
#   etiqueta revisao-dispensada (do usuário) e o PR de sincronização master → staging passam direto.
# - automerge: liga o auto-merge nativo do GitHub; ele faz o merge quando check, meta e revisao-cruzada ficam verdes
#   (proteção do staging).
# - fecha-issue: o "Closes #n" só fecha a issue no merge no master; no staging, o workflow fecha com um aviso.
# - integrado: a cada push no staging, reescreve o PR permanente staging → master e sugere a release.
# - sincroniza: a cada push no master (release ou hotfix), abre o PR master → staging se o staging não tem o master.
#
# Token: o segredo STAGING_TOKEN (token fino do dono, só deste repositório, com Contents e Pull requests de escrita).
# Merge e PR feitos com o GITHUB_TOKEN não disparam outros workflows (CI, preview, este job integrado); com o token do
# dono, disparam. Sem o segredo, o workflow avisa e não liga o auto-merge (o merge no staging fica à mão).
name: Staging

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize, ready_for_review, labeled, closed]
  issue_comment:
    types: [created]
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  actions: write # pede o pages.yml (preview) a cada push no staging
  contents: read
  pull-requests: write
  issues: write
  statuses: write

env:
  GH_REPO: ${{ github.repository }}
  DISPENSA: revisao-dispensada
  # Sugestão de release no PR permanente: um item de peso alto ou este número de itens acumulados.
  SUGERIR_COM_ITENS: 8

jobs:
  portao:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       contains(github.event.comment.body, 'Didn''t find any major issues'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      COMENTADO_EM: ${{ github.event.comment.created_at }}
    steps:
      - name: Status revisao-cruzada
        run: |
          info=$(gh pr view "$PR" --json baseRefName,headRefName,headRefOid,body,labels,isCrossRepository)
          base=$(jq -r .baseRefName <<< "$info"); head=$(jq -r .headRefName <<< "$info"); sha=$(jq -r .headRefOid <<< "$info")
          [ "$base" = "staging" ] || { echo "::notice::PR #$PR não é para o staging."; exit 0; }
          [ "$(jq -r .isCrossRepository <<< "$info")" = "false" ] || { echo "::notice::PR de fork: sem portão."; exit 0; }
          verde() { gh api "repos/$GH_REPO/statuses/$sha" -f state=success -f context=revisao-cruzada -f description="$1" > /dev/null; echo "revisao-cruzada verde em $sha: $1"; }
          if [ "$head" = "master" ]; then verde "Sincronização com o master (já aprovado)"; exit 0; fi
          if jq -e --arg l "$DISPENSA" '[.labels[].name] | index($l)' <<< "$info" > /dev/null; then verde "Revisão dispensada pelo usuário"; exit 0; fi
          if [ -n "$COMENTADO_EM" ]; then
            # PR do Claude: o Codex sem achados, depois do último commit (a aprovação vale para a ponta revisada).
            jq -r .body <<< "$info" | grep -qi 'Implementou: claude' || { echo "::notice::Não é PR do Claude."; exit 0; }
            ultimo=$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date)
            if [[ "$COMENTADO_EM" > "$ultimo" ]]; then verde "Revisão do Codex sem achados"; else echo "::notice::Comentário anterior ao último commit ($ultimo)."; fi
            exit 0
          fi
          # Sem aprovação ainda: pendente, só se o commit não tem status (uma etiqueta nova não apaga a aprovação).
          atual=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "revisao-cruzada")][0].state // empty')
          [ -n "$atual" ] || gh api "repos/$GH_REPO/statuses/$sha" -f state=pending -f context=revisao-cruzada -f description="Esperando a revisão do outro agente" > /dev/null

  automerge:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - name: Ligar o auto-merge
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Sem o segredo STAGING_TOKEN: auto-merge não ligado no PR #$PR; o merge no staging fica à mão (docs/processo/fluxo.md)."
            exit 0
          fi
          # Merge commit (preserva os commits da branch); nunca --admin: espera check, meta e revisao-cruzada.
          GH_TOKEN="$TOKEN" gh pr merge "$PR" --auto --merge

  fecha-issue:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      CORPO: ${{ github.event.pull_request.body }}
    steps:
      - name: Fechar as issues do PR
        run: |
          for n in $(printf '%s' "$CORPO" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
            [ "$(gh issue view "$n" --json state --jq .state 2>/dev/null)" = "OPEN" ] || continue
            gh issue close "$n" --comment "Corrigida no staging pelo PR #$PR. Chega à produção na próxima release (docs/processo/fluxo.md)."
          done

  integrado:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: staging-integrado
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar o preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
      - name: Reescrever o PR permanente
        env:
          GH_TOKEN: ${{ secrets.STAGING_TOKEN || github.token }}
          PREVIEW: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/
        run: |
          git fetch -q origin master
          if [ -z "$(git log --oneline origin/master..HEAD)" ]; then echo "::notice::Staging igual ao master: nada pendente."; exit 0; fi
          npx tsx scripts/staging.ts pr > "$RUNNER_TEMP/pr.json"
          titulo=$(jq -r .titulo "$RUNNER_TEMP/pr.json"); jq -r .corpo "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/corpo.md"
          pr=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base master --head staging --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
            pr=$(gh pr list --base master --head staging --state open --json number --jq '.[0].number // empty')
          else
            gh pr edit "$pr" --title "$titulo" --body-file "$RUNNER_TEMP/corpo.md"
          fi
          # Sugestão de release, uma vez por ciclo (o marcador some quando o PR permanente é mergeado e outro abre).
          if [ "$(jq -r .sugerir "$RUNNER_TEMP/pr.json")" = "true" ] && [ -n "$pr" ] &&
             [ "$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate --jq '.[].body' | grep -c '<!-- staging:sugestao -->' || true)" -eq 0 ]; then
            jq -r .sugestao "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/sugestao.md"
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/sugestao.md"
          fi

  sincroniza:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR master → staging
        env:
          GH_TOKEN: ${{ secrets.STAGING_TOKEN || github.token }}
        run: |
          git fetch -q origin staging || { echo "::notice::Sem branch staging ainda."; exit 0; }
          if git merge-base --is-ancestor origin/master origin/staging; then echo "::notice::O staging já tem o master."; exit 0; fi
          [ -n "$TOKEN" ] || echo "::warning::Sem STAGING_TOKEN: o PR de sincronização não dispara a CI; faça o merge à mão."
          if [ -z "$(gh pr list --base staging --head master --state open --json number --jq '.[0].number // empty')" ]; then
            printf '%s\n' "Traz para o staging o que entrou no master (release ou hotfix), para a próxima versão partir dele (docs/processo/fluxo.md)." "" "Conflito: resolva numa branch feature/sincroniza-<data> a partir do staging, com merge do master, e abra o PR para o staging." > "$RUNNER_TEMP/sync.md"
            gh pr create --base staging --head master --title "Sincroniza o staging com o master" --body-file "$RUNNER_TEMP/sync.md"
          fi
