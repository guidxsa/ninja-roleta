# Verifica cada branch de trabalho e cada PR antes do merge no master (o master publica no Pages a cada push).
# Mesmos passos do build de produção, sem publicar.
name: Verificar

on:
  push:
    branches: ['feature/**']
  pull_request:
    # labeled/unlabeled: a etiqueta contrato-aprovado (check:escopo) roda a verificação de novo
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o check:regras compara a branch com o origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Mesma verificação do pre-push (AGENTS.md, "Definição de pronto"). No PR, o check:regras é estrito.
      - run: npm run check
        env:
          CHECK_ESTRITO: ${{ github.event_name == 'pull_request' }}
          CHECK_PR: ${{ github.event_name == 'pull_request' }}
          CHECK_ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  # Guarda da meta de vitória (scripts/check-meta.ts): simulação curta com seed fixa. Quebrou: proponha ao usuário com
  # a tabela de antes e depois, nunca ajuste número para passar (AGENTS.md).
  meta:
    # Mudança só de etiqueta não muda o código: não roda a simulação de novo.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:meta
