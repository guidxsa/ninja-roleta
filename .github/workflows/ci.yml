# Verifica cada branch de trabalho e cada PR antes do merge (no staging, sozinho; no master, do usuário, que publica no Pages a cada push).
# Mesmos passos do build de produção, sem publicar.
name: Verificar

on:
  push:
    branches: ['feature/**', 'hotfix/**', staging]
  pull_request:
    # labeled/unlabeled: a etiqueta contrato-aprovado (check:escopo) roda a verificação de novo
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read # no push, a base do PR aberto da branch (check:escopo compara com ela)
  issues: read # etiquetas da issue numa branch feature/issue-<n> (correção automática, docs/processo/issues.md)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o check:regras compara a branch com a base (origin/staging ou origin/master)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Aprovações do usuário (scripts/check-aprovacao.ts; AGENTS.md, "Escopo"): só contam as etiquetas que o dono do
      # repositório pôs, e a contrato-aprovado vale para o contrato registrado pelo aprovacao.yml no momento da etiqueta.
      # No PR de feature/issue-<n>, a correcao-automatica da issue (posta pelo dono) vale como aprovação (docs/processo/issues.md).
      - name: Aprovações do usuário
        id: aprov
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          DONO: ${{ github.repository_owner }}
        run: |
          export TIMELINE_PR="$RUNNER_TEMP/timeline-pr.json" COMENTARIOS_PR="$RUNNER_TEMP/comentarios-pr.json"
          n="${HEAD_REF#feature/issue-}"
          if [ "$n" != "$HEAD_REF" ] && [ -n "$n" ] && [ "${n#*[!0-9]}" = "$n" ]; then
            export TIMELINE_ISSUE="$RUNNER_TEMP/timeline-issue.json"
            export ATUAIS_ISSUE="$(gh issue view "$n" --json labels --jq '[.labels[].name] | join(",")' || true)"
            gh api "repos/$GH_REPO/issues/$n/timeline" --paginate > "$TIMELINE_ISSUE" || echo '[]' > "$TIMELINE_ISSUE"
          fi
          # O aprovacao.yml roda junto com esta CI quando a etiqueta entra: espera o registro dele por até 1 minuto.
          for tentativa in 1 2 3 4 5 6 7; do
            export ATUAIS_PR="$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')"
            gh api "repos/$GH_REPO/issues/$PR/timeline" --paginate > "$TIMELINE_PR"
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate > "$COMENTARIOS_PR"
            saida=$(node scripts/check-aprovacao.ts ci)
            printf '%s\n' "$saida" | grep -q '^falta_registro=true$' && [ "$tentativa" -lt 7 ] || break
            echo "Esperando o registro do contrato aprovado (aprovacao.yml)..."; sleep 10
          done
          printf '%s\n' "$saida" | tee -a "$GITHUB_OUTPUT"
      # No push não há GITHUB_BASE_REF: se a branch tem PR aberto, compara com a base dele, como na execução do PR
      # (PR empilhado sobre outra branch, ou para o staging). Sem PR, vale a base pelo nome da branch (harness.ts).
      - name: Base do PR da branch
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          b=$(gh pr list --head "$BRANCH" --state open --json baseRefName --jq '.[0].baseRefName // empty' || true)
          if [ -n "$b" ] && git rev-parse --verify --quiet "origin/$b^{commit}" > /dev/null; then echo "check_base=origin/$b" >> "$GITHUB_OUTPUT"; fi
      # Mesma verificação do pre-push (AGENTS.md, "Definição de pronto"). No PR, o check:regras é estrito.
      - run: npm run check
        env:
          CHECK_BASE: ${{ steps.base.outputs.check_base }}
          CHECK_ESTRITO: ${{ github.event_name == 'pull_request' }}
          CHECK_PR: ${{ github.event_name == 'pull_request' }}
          CHECK_ETIQUETAS: ${{ steps.aprov.outputs.etiquetas }}
          CHECK_ISSUE_ETIQUETAS: ${{ steps.aprov.outputs.issue_etiquetas }}
          CHECK_CONTRATOS: ${{ steps.aprov.outputs.contratos }}

  # Guarda da meta de vitória (scripts/check-meta.ts): simulação curta com seed fixa. Quebrou: proponha ao usuário com
  # a tabela de antes e depois, nunca ajuste número para passar (AGENTS.md).
  meta:
    # Roda em todo evento, inclusive de etiqueta: um check pulado conta como aprovado no GitHub, e uma execução de
    # etiqueta que cancela a anterior (concurrency) não pode deixar a meta sem medir.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:meta
