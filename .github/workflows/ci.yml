# Verifica cada branch de trabalho e cada PR antes do merge (no staging, sozinho com check e meta verdes; no master, do
# usuário, que publica no Pages a cada push).
# Mesmos passos do build de produção, sem publicar.
name: Verificar

on:
  push:
    branches: ['feature/**', 'hotfix/**', staging]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # no push, a base do PR aberto da branch (check:escopo compara com ela)
  issues: read # etiquetas da issue numa branch feature/issue-<n> (correção automática, docs/processo/issues.md)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Os checks exigidos pela proteção do staging e do master são os do PR (`check` e `meta`): no push, os jobs levam outro
# nome, para um check do push (sem o modo estrito nem a etiqueta da issue do loop) não cobrir nem travar o do PR no mesmo
# commit (#55; docs/processo/fluxo.md, "Configuração").
jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'check' || 'check (push)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o check:regras compara a branch com a base (origin/staging ou origin/master)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Correção automática (docs/processo/issues.md): no PR de feature/issue-<n>, a branch só vale com a correcao-automatica
      # que o dono do repositório pôs na issue (scripts/check-aprovacao.ts; bot e agente no Actions não promovem issue).
      - name: Etiquetas da issue do loop
        id: aprov
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/issue-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          DONO: ${{ github.repository_owner }}
        run: |
          n="${HEAD_REF#feature/issue-}"
          case "$n" in ''|*[!0-9]*) echo "issue_etiquetas=" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          export TIMELINE_ISSUE="$RUNNER_TEMP/timeline-issue.json"
          export ATUAIS_ISSUE="$(gh issue view "$n" --json labels --jq '[.labels[].name] | join(",")' || true)"
          gh api "repos/$GH_REPO/issues/$n/timeline" --paginate > "$TIMELINE_ISSUE" || echo '[]' > "$TIMELINE_ISSUE"
          node scripts/check-aprovacao.ts ci | tee -a "$GITHUB_OUTPUT"
      # No push não há GITHUB_BASE_REF: se a branch tem PR aberto, compara com a base dele, como na execução do PR
      # (PR empilhado sobre outra branch, ou para o staging). Sem PR, vale a base pelo nome da branch (harness.ts).
      - name: Base do PR da branch
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          b=$(gh pr list --head "$BRANCH" --state open --json baseRefName --jq '.[0].baseRefName // empty' || true)
          if [ -n "$b" ] && git rev-parse --verify --quiet "origin/$b^{commit}" > /dev/null; then echo "check_base=origin/$b" >> "$GITHUB_OUTPUT"; fi
      # Mesma verificação do pre-push (AGENTS.md, "Definição de pronto"). No PR, o check:regras é estrito.
      - run: npm run check
        env:
          CHECK_BASE: ${{ steps.base.outputs.check_base }}
          CHECK_ESTRITO: ${{ github.event_name == 'pull_request' }}
          CHECK_PR: ${{ github.event_name == 'pull_request' }}
          CHECK_ISSUE_ETIQUETAS: ${{ steps.aprov.outputs.issue_etiquetas }}

  # Guarda da meta de vitória (scripts/check-meta.ts): simulação curta com seed fixa. Quebrou: proponha ao usuário com
  # a tabela de antes e depois, nunca ajuste número para passar (AGENTS.md).
  meta:
    name: ${{ github.event_name == 'pull_request' && 'meta' || 'meta (push)' }}
    # Roda em todo evento: um check pulado conta como aprovado no GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:meta
