<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: K; src: url(../fonts/yuji-boku-kanji.woff2) format('woff2'); }
html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
/* Fundo cheio (ícone "maskable": o sistema recorta em círculo ou quadrado; o selo fica na zona segura de 80%). */
body { background: radial-gradient(ellipse at 50% 30%, #1d1a17 0%, #0d0c0b 75%); display: grid; place-items: center; }
.seal {
  width: 300px; height: 300px; display: grid; place-items: center;
  background: #b5161f; color: #f6ecd6; border-radius: 10px; transform: rotate(-3deg);
  box-shadow: inset 0 0 0 10px #b5161f, inset 0 0 0 15px rgba(246, 236, 214, .7);
  font: 400 196px/1 K;
}
.seal span { transform: translateY(-6px); }
</style></head>
<body><div class="seal"><span>忍</span></div></body></html>
