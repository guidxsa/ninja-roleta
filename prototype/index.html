<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10121b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf4e3" media="(prefers-color-scheme: light)" />
    <title>Ninja Roleta</title>
    <script>
      // Tema antes da primeira pintura (sem piscar): o escolhido no botão ou o do aparelho.
      try {
        var t = JSON.parse(localStorage.getItem('proto_settings_v1') || '{}').theme;
      } catch (e) {}
      document.documentElement.dataset.theme =
        t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    </script>
    <!-- Fontes de pincel/estilo japonês. Sem internet, caem para as fontes do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shojumaru&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <style>
/*STYLE*/
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="seal" aria-hidden="true">忍</span> <b>Ninja Roleta</b> <small>protótipo</small></div>
      <div class="top-actions">
        <label class="toggle small"><input type="checkbox" id="instant" /> ⚡ <span id="instant-label"></span></label>
        <button class="btn small" id="theme-btn"></button>
        <button class="btn small" id="sfx-btn"></button>
        <button class="btn small" id="music-btn"></button>
        <button class="btn small" id="sheet-btn" title="Ficha ninja" aria-label="Ficha ninja">🥷</button>
        <button class="btn small" id="history-btn" title="Histórico" aria-label="Histórico">📜</button>
      </div>
      <div class="dots" id="dots"></div>
    </header>
    <main id="screen"></main>
    <footer><small id="disclaimer"></small></footer>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
