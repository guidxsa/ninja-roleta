<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1918" />
    <title>Ninshu Roots</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      // Modo instantâneo também encurta as transições da interface (CSS em styles/instant.css).
      try {
        var s = JSON.parse(localStorage.getItem('proto_settings_v1') || '{}');
        if (s.instant) document.documentElement.dataset.instant = '';
        // Modo Animado: a cena viva do Portão (styles/menu.css) já nasce ligada, sem piscar.
        if (s.animated) document.documentElement.dataset.animated = '';
      } catch (e) {}
    </script>
    <!-- As fontes vêm embutidas no CSS (styles/fonts.css): o jogo não depende de internet. -->
    <style>
/*STYLE*/
    </style>
  </head>
  <body>
    <header class="top">
      <button class="top-grip" type="button" aria-controls="top-tools" aria-expanded="false"></button>
      <div id="top-tools">
      <div class="top-bar">
        <span class="brand" aria-hidden="true"><span class="seal brand-seal"></span><span class="brand-name">Ninshu Roots</span></span>
        <button class="btn small" id="home-btn" title="Portão da Vila" aria-label="Portão da Vila"></button>
        <div class="top-actions">
          <div class="tool-group">
            <button class="btn small" id="instant-btn"></button>
            <button class="btn small" id="anim-btn"></button>
            <button class="btn small" id="sfx-btn"></button>
            <button class="btn small" id="music-btn"></button>
          </div>
          <div class="tool-group">
            <button class="btn small" id="sheet-btn" title="Ficha ninja" aria-label="Ficha ninja"></button>
            <button class="btn small" id="history-btn" title="Registro ninja" aria-label="Registro ninja"></button>
          </div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
      </div>
    </header>
    <nav class="side-nav" id="side-nav"></nav>
    <main id="screen" tabindex="-1"></main>
    <nav class="gate-nav" id="gate-nav"></nav>
    <footer><p class="quote-strip" id="quote-strip"></p><span class="foot-legal"><small id="disclaimer"></small> <small id="version" class="version"></small></span></footer>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
