    <meta charset="utf-8" />

    <meta name="robots" content="noindex" />
    <title>UI Lab · Ninshu Roots</title>
    <script>
      (function () {

        if (p.get('instant') === '1') document.documentElement.dataset.instant = '';

      <div class="dots" id="dots"></div>
